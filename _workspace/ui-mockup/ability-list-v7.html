<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AbilityListV7 목업 — 용어집 정의 목록</title>
    <!-- 목업 전용: Tailwind v4 브라우저 빌드. 실제 구현은 프로젝트 토큰(bg-accent 등)을 쓴다. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      html {
        scroll-padding-top: 72px;
      }
    </style>
  </head>
  <body class="bg-white text-zinc-900">
    <!-- 앱 헤더 (sticky h-13 = 52px, z-50) -->
    <header class="sticky top-0 z-50 bg-white/70 backdrop-blur-md">
      <div class="flex h-13 items-center px-4 font-bold">poke-mumu</div>
    </header>

    <main class="mx-auto flex w-full max-w-[calc(90rem+4.375vw*2)] flex-col gap-6 px-4 py-6 sm:px-6 md:px-[4.375vw] md:py-12">
      <!-- AbilitySearch (기존) — 예시 검색어: "불" -->
      <div class="flex h-10.5 items-center rounded-full bg-zinc-100 px-4 text-sm text-zinc-900">불</div>

      <div class="flex flex-col gap-8">
        <!-- 개수 줄 + 툴바: md 이상 한 줄, 미만은 세로 스택 -->
        <div class="flex flex-col gap-5 md:flex-row md:items-center md:justify-between">
          <div class="flex items-center justify-between gap-x-4 text-sm text-zinc-600 md:justify-start">
            <span aria-live="polite">6개의 특성</span>
            <span class="tabular-nums">1 / 1 페이지</span>
          </div>

          <!-- shared/ui/tabs (TabsList default = 세그먼트 pill) 재사용 -->
          <div class="grid grid-cols-2 gap-3 sm:flex sm:items-center">
            <div role="tablist" aria-label="범위" class="inline-flex h-11 w-full items-center rounded-full bg-zinc-100 p-1 sm:w-fit">
              <button role="tab" aria-selected="true" class="h-full flex-1 rounded-full bg-white px-4 text-sm font-medium">전체</button>
              <button role="tab" aria-selected="false" class="h-full flex-1 rounded-full px-4 text-sm font-medium text-zinc-500">챔피언스</button>
            </div>
            <div role="tablist" aria-label="정렬" class="inline-flex h-11 w-full items-center rounded-full bg-zinc-100 p-1 sm:w-fit">
              <button role="tab" aria-selected="true" class="h-full flex-1 rounded-full bg-white px-4 text-sm font-medium">가나다순</button>
              <button role="tab" aria-selected="false" class="h-full flex-1 rounded-full px-4 text-sm font-medium text-zinc-500">ABC순</button>
            </div>
          </div>
        </div>

        <!--
          용어집 <dl>: 항목마다 <div>(dt + dd) 그룹.
          md 이상 2열 [14rem | 1fr], 미만 세로 스택.
          행 전체 클릭 = dt 안 Link의 after:absolute inset-0 (stretched link).
          구분선 = 행 ::before (inset-x-3, 첫 행 제외), 호버 행과 그 다음 행의 선은 숨긴다.
          목록 px-3 + 행 -mx-3 px-3 bleed → 호버 배경/포커스 링이 잘리지 않는다.
        -->
        <dl class="flex flex-col px-3">
          <div class="group relative -mx-3 flex flex-col gap-3 rounded-2xl px-3 py-6 before:absolute before:inset-x-3 before:top-0 before:h-px before:bg-zinc-200 first:before:hidden md:grid md:grid-cols-[14rem_minmax(0,1fr)] md:items-baseline md:gap-x-12 md:py-7 [@media(hover:hover)]:hover:bg-zinc-100 [@media(hover:hover)]:hover:before:opacity-0 [@media(hover:hover)]:[div:hover+&]:before:opacity-0">
            <dt class="flex min-w-0 flex-col gap-1.5">
              <span class="flex flex-wrap items-center gap-x-2.5 gap-y-1">
                <a href="#" class="text-base font-semibold break-keep outline-none after:absolute after:inset-0 after:rounded-2xl focus-visible:after:ring-[3px] focus-visible:after:ring-blue-400/50 md:text-lg"><mark class="rounded-sm bg-blue-500/15 text-zinc-900">불</mark>꽃몸</a>
              </span>
              <span class="text-sm break-words text-zinc-500">Flame Body · ほのおのからだ</span>
            </dt>
            <dd class="flex min-w-0 items-start gap-6">
              <p class="flex-1 text-sm leading-relaxed break-keep text-zinc-600 md:text-base">
                뜨거운 몸 때문에 접촉한 상대를 화상 상태로 만들 때가 있다. 설명은 줄 수 제한 없이 전문을 보여 주어 용어집처럼 읽힌다.
              </p>
              <svg aria-hidden="true" class="hidden size-5 shrink-0 self-center text-zinc-400 opacity-0 transition-opacity group-has-[a:focus-visible]:opacity-100 md:block [@media(hover:hover)]:group-hover:opacity-100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6" /></svg>
            </dd>
          </div>

          <div class="group relative -mx-3 flex flex-col gap-3 rounded-2xl px-3 py-6 before:absolute before:inset-x-3 before:top-0 before:h-px before:bg-zinc-200 first:before:hidden md:grid md:grid-cols-[14rem_minmax(0,1fr)] md:items-baseline md:gap-x-12 md:py-7 [@media(hover:hover)]:hover:bg-zinc-100 [@media(hover:hover)]:hover:before:opacity-0 [@media(hover:hover)]:[div:hover+&]:before:opacity-0">
            <dt class="flex min-w-0 flex-col gap-1.5">
              <span class="flex flex-wrap items-center gap-x-2.5 gap-y-1">
                <a href="#" class="text-base font-semibold break-keep outline-none after:absolute after:inset-0 after:rounded-2xl focus-visible:after:ring-[3px] focus-visible:after:ring-blue-400/50 md:text-lg"><mark class="rounded-sm bg-blue-500/15 text-zinc-900">불</mark>면</a>
                <span class="shrink-0 rounded-full border px-2 py-0.5 text-xs text-zinc-500">챔피언스</span>
              </span>
              <span class="text-sm break-words text-zinc-500">Insomnia · ふみん</span>
            </dt>
            <dd class="flex min-w-0 items-start gap-6">
              <p class="flex-1 text-sm leading-relaxed break-keep text-zinc-600 md:text-base">잠들지 못하는 체질이라 잠듦 상태가 되지 않는다.</p>
              <svg aria-hidden="true" class="hidden size-5 shrink-0 self-center text-zinc-400 opacity-0 transition-opacity group-has-[a:focus-visible]:opacity-100 md:block [@media(hover:hover)]:group-hover:opacity-100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6" /></svg>
            </dd>
          </div>

          <div class="group relative -mx-3 flex flex-col gap-3 rounded-2xl px-3 py-6 before:absolute before:inset-x-3 before:top-0 before:h-px before:bg-zinc-200 first:before:hidden md:grid md:grid-cols-[14rem_minmax(0,1fr)] md:items-baseline md:gap-x-12 md:py-7 [@media(hover:hover)]:hover:bg-zinc-100 [@media(hover:hover)]:hover:before:opacity-0 [@media(hover:hover)]:[div:hover+&]:before:opacity-0">
            <dt class="flex min-w-0 flex-col gap-1.5">
              <span class="flex flex-wrap items-center gap-x-2.5 gap-y-1">
                <a href="#" class="text-base font-semibold break-keep outline-none after:absolute after:inset-0 after:rounded-2xl focus-visible:after:ring-[3px] focus-visible:after:ring-blue-400/50 md:text-lg">타오르는<mark class="rounded-sm bg-blue-500/15 text-zinc-900">불</mark>꽃</a>
              </span>
              <!-- nameJa가 null이면 영문명만 -->
              <span class="text-sm break-words text-zinc-500">Flash Fire</span>
            </dt>
            <dd class="flex min-w-0 items-start gap-6">
              <p class="flex-1 text-sm leading-relaxed break-keep text-zinc-600 md:text-base">불꽃타입의 기술을 받으면 불꽃을 받아서 자신이 사용하는 불꽃타입 기술이 강해진다.</p>
              <svg aria-hidden="true" class="hidden size-5 shrink-0 self-center text-zinc-400 opacity-0 transition-opacity group-has-[a:focus-visible]:opacity-100 md:block [@media(hover:hover)]:group-hover:opacity-100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6" /></svg>
            </dd>
          </div>
        </dl>

        <!-- 페이지네이션 (shared/ui/pagination, 2페이지 이상일 때만) -->
        <nav class="flex items-center justify-center gap-1 pt-4">
          <button class="inline-flex size-9 items-center justify-center rounded-md border border-zinc-900 bg-zinc-900 text-sm font-medium text-white">1</button>
          <button class="inline-flex size-9 items-center justify-center rounded-md border text-sm font-medium">2</button>
        </nav>

        <!-- 빈 상태 A: 검색 결과 자체가 0개 -->
        <div class="mt-16 border-t py-12 font-medium text-zinc-500">일치하는 특성이 없습니다</div>

        <!-- 빈 상태 B: 챔피언스 범위 때문에만 0개 -->
        <div class="flex flex-col items-start gap-4 border-t py-12">
          <div class="font-medium text-zinc-500">일치하는 특성이 없습니다</div>
          <button class="h-10 rounded-full border px-4 text-sm font-medium">전체 보기</button>
        </div>
      </div>
    </main>
  </body>
</html>
